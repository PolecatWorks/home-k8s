---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db0-agent-as-data-user
  namespace: dbs
spec:
  refreshInterval: "0"
  target:
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: db0_agent_as_data
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: db0-password
